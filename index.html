<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The best crate to dig is your own. BINDIG is the AI agent for Rekordbox that finds the gems you've never played.">
<title>BINDIG</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#050706">
<meta property="og:type" content="website"><meta property="og:site_name" content="BINDIG"><meta property="og:url" content="https://bindig.netlify.app/"><meta property="og:title" content="BINDIG"><meta property="og:description" content="The best crate to dig is your own. BINDIG is the AI agent for Rekordbox that finds the gems you've never played."><meta property="og:image" content="https://bindig.netlify.app/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://bindig.netlify.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#050706;--panel:#0A0F0C;--line:#1C2A21;--ink:#E6EEE8;--muted:#8A968E;--dim:#12201A;--signal:#78F09A;--signal-ink:#04130A;--amber:#F2C14E;--glow:0 0 18px rgba(120,240,154,.45);
--display:"Doto","JetBrains Mono",ui-monospace,Menlo,monospace;--mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(120,240,154,.08),transparent 70%),linear-gradient(rgba(120,240,154,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(120,240,154,.03) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;color:var(--ink);font:15px/1.65 var(--mono);padding-inline:20px;font-variant-numeric:tabular-nums}
a{color:var(--signal)}:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;line-height:1.05;text-wrap:balance;text-transform:uppercase}
p{margin:0}
.sig{color:var(--signal);text-shadow:var(--glow)}
.btn{box-shadow:0 0 30px rgba(120,240,154,.3);background:var(--signal);color:var(--signal-ink);border:0;font:700 15px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:17px 34px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.1)}
.muted{color:var(--muted)}
.foot{font-size:12px;color:var(--muted);display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding-block:24px}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.caret::after{content:"_";animation:blink 1s steps(1) infinite;color:var(--signal)}@keyframes blink{50%{opacity:0}}}

.center{min-height:calc(100vh - 80px);display:grid;place-items:center;text-align:center}
.stack{display:grid;gap:22px;justify-items:center;max-width:720px}
.word{font:900 clamp(64px,13vw,148px)/1 var(--display);letter-spacing:.06em;color:var(--signal);text-shadow:0 0 40px rgba(120,240,154,.45)}
.what{font-size:clamp(16px,2.2vw,20px);color:var(--ink)}
.tag{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(20px,3vw,30px);line-height:1.15}
.small{font-size:13px;color:var(--muted)}

</style>
</head>
<body>
<main class="center">
  <div class="stack">
    <div class="word" aria-label="BINDIG">BINDIG</div>
    <p class="tag">The best crate to dig<br><span class="sig">is your own.</span><span class="caret"></span></p>
    <p class="what">The AI agent that finds the gems you've never played.</p>
    <a class="btn" href="/meet/">&gt; Start</a>
    <p class="small">For Rekordbox DJs · Free to try · Your library stays untouched · <a href="/guide/">How it works</a></p>
  </div>
</main>
<footer class="foot"><span>BINDIG · beta</span><span>Not affiliated with AlphaTheta or Pioneer DJ.</span></footer>
</body>
</html>
